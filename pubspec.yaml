name: expressive_ui_kit
description: >-
  Material 3 Expressive widgets for Flutter. Spring-physics motion, shape
  morphing, wavy progress indicators, FAB menus, button groups, expressive
  sliders and more — drop-in replacements for standard Material widgets.
version: 0.3.0
homepage: https://m3.material.io
repository: https://github.com/asimawdah/expressive_ui_kit
issue_tracker: https://github.com/asimawdah/expressive_ui_kit/issues
documentation: https://github.com/asimawdah/expressive_ui_kit#readme

topics:
  - material
  - material-design
  - widgets
  - ui
  - animation

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  material_new_shapes: ^1.0.0
  flutter_credit_card: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
